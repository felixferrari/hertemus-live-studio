<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERTEMUS | Chat ao Vivo</title>
<style>
:root{color-scheme:dark;--bg:#0b0812;--panel:#151022;--line:#392259;--purple:#a64cff;--text:#f5efff;--muted:#a998bb;--ok:#55e6a1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#29103c,#0b0812 55%);color:var(--text);font:14px Segoe UI,Arial,sans-serif;height:100vh;overflow:hidden}.wrap{height:100%;display:flex;flex-direction:column;padding:18px;gap:12px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:19px;font-weight:800;letter-spacing:.5px}.sub{color:var(--muted);font-size:11px;margin-top:4px}.state{color:var(--ok);font-weight:700;font-size:11px}.messages{flex:1;overflow:auto;background:#09070e;border:1px solid var(--line);border-radius:12px;padding:10px}.empty{color:var(--muted);padding:18px;text-align:center}.msg{padding:9px 6px;border-bottom:1px solid #21162d;line-height:1.35}.name{color:#d39aff;font-weight:800}.source{color:#8d7a9c;font-size:10px;margin-left:7px}.text{display:block;color:#eee7f6;margin-top:3px;word-break:break-word}.paid{border-left:3px solid #ffd05c;padding-left:9px}.foot{color:var(--muted);font-size:10px}
</style>
</head>
<body><main class="wrap"><header class="head"><div><div class="title">HERTEMUS · Chat ao Vivo</div><div class="sub">Eventos recebidos pelos conectores configurados</div></div><div id="state" class="state">● aguardando servidor</div></header><section id="messages" class="messages"><div class="empty">Aguardando mensagens do YouTube…</div></section><footer class="foot">Nesta etapa, o conector YouTube usa a autenticação do HERTEMUS Alerts. Twitch e Kick serão adicionados ao mesmo barramento.</footer></main>
<script>
let since=0;const box=document.getElementById('messages'),state=document.getElementById('state');
function add(e){if(!e||!['chat','superchat','sticker','member','milestone','gift','giftreceived'].includes(e.type))return;const d=e.data||e;const row=document.createElement('div');row.className='msg '+(['superchat','sticker','gift'].includes(e.type)?'paid':'');const name=d.name||'Usuário';const text=d.message||d.detail||d.amount||'';row.innerHTML='<span class="name"></span><span class="source">YouTube</span><span class="text"></span>';row.querySelector('.name').textContent=name;row.querySelector('.text').textContent=text;const empty=box.querySelector('.empty');if(empty)empty.remove();box.appendChild(row);while(box.children.length>200)box.firstElementChild.remove();box.scrollTop=box.scrollHeight}
async function poll(){try{const r=await fetch('/api/events?since='+since,{cache:'no-store'});const j=await r.json();(j.events||[]).forEach(e=>{since=Math.max(since,Number(e.id)||0);add(e)});state.textContent='● conector YouTube ativo';}catch(e){state.textContent='● aguardando servidor'}}setInterval(poll,1500);poll();
</script></body></html>
