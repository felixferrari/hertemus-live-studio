 if(!el)return;
 const original=el.textContent;

 // Busca binária de tamanho em pixels inteiros: um passo de tamanho por frame.
 let lo=minPx,hi=maxPx,best=minPx;
 while(lo<=hi){const mid=Math.floor((lo+hi)/2);el.style.fontSize=mid+'px';
